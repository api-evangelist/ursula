description: >-
  Ursula is a Brazil-based AI startup building AI-native characters. Founded
  by an Emmy-winning team with experience at Pixar, Unity, Blizzard, and
  Google, it combines LLMs, symbolic AI, and long-term memory to power
  emotionally aware digital beings that evolve and connect with users across
  games, apps, and digital worlds. Ursula is a seed-stage Prosus Ventures
  portfolio company surfaced for the API Evangelist network. It publishes no
  public developer API program, and at enrichment time its Framer-hosted
  website at ursula.ai returned HTTP 404 (site unpublished) while the domain
  retained valid TLS and SPF/DMARC records.
